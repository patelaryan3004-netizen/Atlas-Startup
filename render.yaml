services:
  - type: web
    name: au-startup-map-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # The Neon Postgres address (docs/database.md). Its value is set in the Render dashboard, never here: it holds the password.
      - key: DATABASE_URL
        sync: false
