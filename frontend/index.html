<script>
  // Starts downloads before any script has run: the snapshot of the first views (src/snapshot.js) on the pages that draw from it, and the
  // files of the page this address opens (vitePreload.js fills in their names at build).
  (function () {
    document.documentElement.classList.add('js'); // the page's scripts run: the plain HTML written for search engines and no-script visitors (.static-shell) is not shown
    var path = location.pathname.replace(/\/$/, ''), search = location.search, files = /*ROUTE_FILES*/{};
    // Discover (the list of startups, or the map with ?view=map) draws its first views from the snapshot; so does a company's page and an older link to the map (/?sector=AI).
    var filters = /[?&](search|sector|city|investor|stage|hiring|taskGate|events|precision|state|remote|tech|team|cohort|fresh|view|show)=/;
    // The root is the welcome page (the homepage), which reads no data; an older link to the root with a filter or a view in its query opens the app, as before.
    var welcome = (path === '' || path === '/welcome') && !filters.test(search);
    var discover = path === '/discover' || path === '/map' || /^\/startup\//.test(path) || (path === '' && filters.test(search));
    if (discover) {
      window.__auSnapshot = fetch('/data/snapshot.json').then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; });
    }
    var kinds = welcome || /^\/(about|methodology|contact)$/.test(path) ? []
      : discover ? (path === '/map' || /[?&]view=map/.test(search) ? ['app', 'map'] : ['app', 'list'])
      : path === '/jobs' || path === '/opportunities' ? ['app', 'jobs']
      : path === '/home' ? ['app', 'home']
      : /^\/(investors|news|people|events|saved|me|members|moderation|discover)(\/|$)|^\/lists$|[?&]view=(jobs|lists|investors|saved)/.test(path + search) ? ['app']
      : /^\/lists\//.test(path) ? ['app', 'list']
      : ['app', 'list'];
    function add(rel, href, as) {
      var link = document.createElement('link');
      link.rel = rel; link.href = href; link.crossOrigin = '';
      if (as) link.as = as;
      document.head.appendChild(link);
    }
    kinds.forEach(function (kind) {
      var found = files[kind];
      if (!found) return;
      found.js.forEach(function (href) { add('modulepreload', href); });
      found.css.forEach(function (href) { add('preload', href, 'style'); });
    });
  })();
</script>
</head>
<body>
<div id="root"></div>
<noscript>
