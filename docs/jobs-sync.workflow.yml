# The hourly job-board sync: reads every approved employer job board that is due and keeps jobs.json in line with what the employers list. See docs/jobs-sync.md.
#
# STATUS: NOT INSTALLED, AND NOT ENABLED. This copy lives in docs/ because GitHub refuses a push that adds a workflow file unless the credential has the "workflow" scope, and the one
# used for this repository has only gist, read:org and repo. To install it: create .github/workflows/jobs-sync.yml in GitHub's web editor and paste this in (or push it with a credential
# that has the scope: `gh auth refresh -s workflow`). Once installed it still does nothing until the repository VARIABLE JOBSYNC_ENABLED is "true" (Settings > Secrets and variables >
# Actions > Variables). Turn it off the same way. It has never run on GitHub.
#
# It is the ONLY schedule for this job: the scheduler's other six jobs (docs/scheduler.md, docs/scheduled-refresh.workflow.yml) do not include `jobsync` unless it is named, so the two
# workflows never read the same boards. Each board is read at most about once an hour whichever way it is started: the state file says when it may be read again.
#
# What it does with what it reads: the state lives in git (Render's free disk is erased on every deploy, so a database file there would not last). A run commits backend/src/data only when
# something a visitor could see changed (a role added, hidden, archived, edited, a board failing or recovering) or the data is a day old. A commit that changed roles redeploys the API
# (Render deploys main), which is how a new role reaches the site; a heartbeat-only commit is marked [skip render]. An hour in which nothing moved makes no commit at all.
name: Job board sync (hourly)

on:
  schedule:
    - cron: '9 * * * *' # once an hour, off the hour so it does not queue with everyone else's
  workflow_dispatch:
    inputs:
      force:
        description: 'Read every board now, even those read within the hour'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# One run at a time, and never cut one short half way through writing.
concurrency:
  group: jobsync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: ${{ vars.JOBSYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50 # the rule "commit at least once a day" reads the last commit that touched the data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Read the employer boards that are due
        working-directory: backend
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=(tick --job jobsync --by github-actions --trigger ci --max-minutes 8)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node scripts/scheduler.js "${args[@]}"

      - name: Did anything a visitor could see change?
        id: changed
        working-directory: backend
        run: node scripts/jobsync.mjs meaningful

      - name: Leave the data alone when only dates moved
        if: steps.changed.outputs.commit != 'yes'
        run: git checkout -- backend/src/data

      - name: Commit what changed
        if: steps.changed.outputs.commit == 'yes'
        env:
          REASON: ${{ steps.changed.outputs.reason }}
          DEPLOY: ${{ steps.changed.outputs.deploy }}
        run: |
          git config user.name 'AU Startup Map job sync'
          git config user.email 'actions@users.noreply.github.com'
          # Only what a sync is for: the roles, the board state, the catalogue, the run log, the audit entry of the run, and startups.json (whose derived "hiring checked" dates follow the
          # roles; the data-integrity test fails on main if they are left behind). A tick also seeds refresh_state.json (the other scheduler jobs' bookkeeping, thousands of lines) as a side
          # effect: that is not part of a job sync and is left out on purpose.
          git add backend/src/data/jobs.json backend/src/data/job_sync_state.json backend/src/data/job_sources.json backend/src/data/job_runs.json backend/src/data/audit_trail.json backend/src/data/startups.json
          if git diff --cached --quiet; then echo 'Nothing to commit.'; exit 0; fi
          message="data: job board sync ($REASON)"
          if [ "$DEPLOY" != "yes" ]; then message="$message [skip render]"; fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push failed (attempt $attempt); trying again"; sleep $((attempt * 5))
          done
          echo 'Could not push: someone changed the same files meanwhile. The next run reads again.'
          exit 1
